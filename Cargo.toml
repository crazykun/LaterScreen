[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/app", "crates/ocr", "crates/record", "crates/setup"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"

# 发布产物体积优化：z 级优化 + fat LTO + 去符号 + abort panic
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# 开发期保持快速编译
[profile.dev]
opt-level = 1
