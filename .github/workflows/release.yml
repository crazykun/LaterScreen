# 发布打包：推 tag（v*）自动构建全平台包并发布 GitHub Release；
# 手动 workflow_dispatch 只出构建产物（Artifacts），不发 Release。
#
# 平台矩阵：
#   Linux   x64 / arm64 / armv7 / x86（ubuntu-22.04，交叉 gcc 链接，
#           项目链接期仅 libc，见 scripts/package.sh 头部说明）
#           每个架构出 tar.gz + deb + rpm + AppImage
#   Windows x64（MSVC）：zip + 自绘安装器 exe（egui，crates/setup 内嵌主程序）
#   macOS   arm64 / x64：tar.gz + dmg（拖拽安装式 .app）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-gnu,     apt: gcc-aarch64-linux-gnu }
          - { os: ubuntu-22.04,   target: armv7-unknown-linux-gnueabihf, apt: gcc-arm-linux-gnueabihf }
          - { os: ubuntu-22.04,   target: i686-unknown-linux-gnu,        apt: gcc-i686-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装打包工具（Linux：交叉 gcc + rpm + appimagetool）
        if: runner.os == 'Linux'
        run: |
          # GitHub runner 默认挂了 azure.archive.ubuntu.com 镜像，高峰期反复超时重试（可卡 20+ 分钟）；
          # 把所有 apt 源里的 azure 主机改回 archive.ubuntu.com，并为 update 失败兜底重试一次
          sudo grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null \
            | sudo xargs -r sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          sudo apt-get update -q || { sleep 10; sudo apt-get update -q; }
          sudo apt-get install -y -q rpm ${{ matrix.apt }}
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: 构建并打包
        shell: bash
        run: bash scripts/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS
      - name: 准备发布说明（doc/release-notes/<tag>.md）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NOTES="doc/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "此版本未提供发布说明，详见提交历史。" > "$NOTES"
          fi
          cp "$NOTES" release_body.md
      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release_body.md
