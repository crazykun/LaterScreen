# 发布打包：推 tag（v*）自动构建全平台包并发布 GitHub Release；
# 手动 workflow_dispatch 只出构建产物（Artifacts），不发 Release。
#
# 平台矩阵：
#   Linux   x64 / arm64 / armv7 / x86（ubuntu-22.04，交叉 gcc 链接，
#           项目链接期仅 libc，见 scripts/package.sh 头部说明）
#   Windows x64（MSVC）
#   macOS   arm64 / x64
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-gnu,     apt: gcc-aarch64-linux-gnu }
          - { os: ubuntu-22.04,   target: armv7-unknown-linux-gnueabihf, apt: gcc-arm-linux-gnueabihf }
          - { os: ubuntu-22.04,   target: i686-unknown-linux-gnu,        apt: gcc-i686-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装交叉链接器
        if: matrix.apt
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.apt }}
      - name: 构建并打包
        shell: bash
        run: bash scripts/package.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS
      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
