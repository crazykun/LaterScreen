# 发布打包：推 tag（v*）自动构建全平台包并发布 GitHub Release；
# 手动 workflow_dispatch 只出构建产物（Artifacts），不发 Release。
#
# 平台矩阵：
#   Linux   x64 / arm64（ubuntu-22.04，交叉 gcc 链接，
#           项目链接期仅 libc，见 scripts/package.sh 头部说明）
#           每个架构出 tar.gz + deb + AppImage
#   Windows x64（MSVC）：zip + 自绘安装器 exe（egui，crates/setup 内嵌主程序）
#   macOS   universal（arm64 + x86_64 胖二进制）：一个 dmg 双架构通用，
#           tar.gz 仍按架构各一份
# 已砍：armv7 / i686（32 位桌面架构已死，5 个版本 20 个附件 0 下载）；
#       rpm 格式（全架构 0 下载，纯页面噪音）。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }
          # openh264（MP4 编码）是 C++ 源，交叉编译除 gcc 还需对应的 g++
          - { os: ubuntu-22.04,   target: aarch64-unknown-linux-gnu, apt: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # universal2-apple-darwin 是 package.sh 的合成目标（脚本内编两片
          # lipo 合一）；rustup 没有这个 triple，工具链装的是两个真实切片
          - { os: macos-latest, target: universal2-apple-darwin,
              rust-targets: "aarch64-apple-darwin x86_64-apple-darwin" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: 安装打包工具（Linux：交叉 gcc + appimagetool）
        if: runner.os == 'Linux'
        run: |
          # GitHub runner 默认挂了 azure.archive.ubuntu.com 镜像，高峰期反复超时重试（可卡 20+ 分钟）；
          # 把所有 apt 源里的 azure 主机改回 archive.ubuntu.com，并为 update 失败兜底重试一次
          sudo grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null \
            | sudo xargs -r sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g'
          sudo apt-get update -q || { sleep 10; sudo apt-get update -q; }
          sudo apt-get install -y -q ${{ matrix.apt }}
          sudo curl --retry 5 --retry-delay 10 --retry-all-errors -fsSL \
            -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: 导入 macOS 签名证书（自签名，跨版本稳定 TCC 身份）
        if: runner.os == 'macOS'
        env:
          LSCREEN_SIGN_KEY_PEM_B64: ${{ secrets.LSCREEN_SIGN_KEY_PEM_B64 }}
          LSCREEN_SIGN_CERT_PEM_B64: ${{ secrets.LSCREEN_SIGN_CERT_PEM_B64 }}
        run: |
          if [ -z "$LSCREEN_SIGN_KEY_PEM_B64" ]; then
            echo "::warning::未配置签名证书 secret，退回 ad-hoc 签名（升级需重新授权一次）"
            exit 0
          fi
          echo "$LSCREEN_SIGN_KEY_PEM_B64" | base64 -d > "$RUNNER_TEMP/lscreen-key.pem"
          echo "$LSCREEN_SIGN_CERT_PEM_B64" | base64 -d > "$RUNNER_TEMP/lscreen-cert.pem"
          security create-keychain -p lscreen-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p lscreen-build build.keychain
          security import "$RUNNER_TEMP/lscreen-key.pem" -k build.keychain -T /usr/bin/codesign
          security import "$RUNNER_TEMP/lscreen-cert.pem" -k build.keychain -T /usr/bin/codesign
          # 自签名根必须进信任域，codesign 才认这个身份（-d 管理域免 GUI，
          # runner 有免密 sudo；本机操作走用户域会弹密码框）
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k build.keychain "$RUNNER_TEMP/lscreen-cert.pem"
          security set-key-partition-list -S apple-tool:,apple: -k lscreen-build build.keychain
          rm -f "$RUNNER_TEMP/lscreen-key.pem"
          echo "LSCREEN_SIGN_IDENTITY=LaterScreen" >> "$GITHUB_ENV"
      - name: 构建并打包
        shell: bash
        run: bash scripts/package.sh "${{ matrix.target }}"
      - name: 体积门槛（单产物 ≤ 30MB 硬约束）
        shell: bash
        run: |
          # PLAN §1 体积预算（2026-11 自 20MB 上调至 30MB，为中文本地 OCR 引擎
          # 让出余量，预算再上调须单独提交写明用途）。ci.yml 只在 Linux x86_64
          # 宿主构建上检查裸二进制，这道闸覆盖全部发布产物——尤其内嵌主程序的
          # Windows 安装器与 macOS universal 胖包。wc -c 而非 stat -c：三平台
          # runner 的 bash 均可用。
          FAIL=0
          for f in dist/*; do
            SIZE=$(wc -c < "$f" | tr -d ' ')
            echo "$f: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
            if [ "$SIZE" -gt $((30 * 1024 * 1024)) ]; then
              echo "::error::体积超限 $f"
              FAIL=1
            fi
          done
          test "$FAIL" -eq 0
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # release 说明来自仓库文件，必须 checkout 源码（否则工作区无 docs/ 目录）
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: cd dist && sha256sum * > SHA256SUMS
      - name: 准备发布说明（docs/release-notes/<tag>.md）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release_body.md
          else
            echo "此版本未提供发布说明，详见提交历史。" > release_body.md
          fi
      - name: 发布 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release_body.md
