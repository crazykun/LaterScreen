name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 周一 03:00 UTC：依赖版本没变也会冒出新公告，纯 PR 触发看不见这类
    - cron: '0 3 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  # 供应链：RUSTSEC 安全公告扫描。只对真实漏洞失败；unmaintained/unsound
  # 属警告不拦截（gtk 系警告来自 tray-icon 的 Win/mac 依赖，Linux 扫描
  # 全量 lock 时必然出现）
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
  # 格式与 lint 门槛（快，先失败）
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Linux：完整 build + test + release 体积回归
  linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & test
        run: |
          cargo build --workspace
          cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Size regression (<= 20MB)
        run: |
          SIZE=$(stat -c%s target/release/lscreen)
          echo "binary size: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
          test "$SIZE" -le $((20 * 1024 * 1024))
      - name: No forbidden dynamic deps
        run: |
          # 只允许 libc/libm/libgcc/libstdc++/ld/vdso；出现 X11/GTK/pipewire 等即失败
          # libstdc++ 由 openh264（C++ 源码静态链接进 MP4 编码器）带来，属预期
          BAD=$(ldd target/release/lscreen | grep -vE 'linux-vdso|libgcc_s|libm\.so|libc\.so|libstdc\+\+\.so|ld-linux' || true)
          if [ -n "$BAD" ]; then echo "unexpected dynamic deps:"; echo "$BAD"; exit 1; fi

  # Windows / macOS：编译验证（xcap 系统 API 路径此前从未被验证过）
  windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
