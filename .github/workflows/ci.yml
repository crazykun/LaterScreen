name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux：完整 build + test + release 体积回归
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & test
        run: |
          cargo build --workspace
          cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Size regression (<= 10MB)
        run: |
          SIZE=$(stat -c%s target/release/lscreen)
          echo "binary size: $((SIZE / 1024 / 1024))MB ($SIZE bytes)"
          test "$SIZE" -le $((10 * 1024 * 1024))
      - name: No forbidden dynamic deps
        run: |
          # 只允许 libc/libm/libgcc/ld/vdso；出现 X11/GTK/pipewire 等即失败
          BAD=$(ldd target/release/lscreen | grep -vE 'linux-vdso|libgcc_s|libm\.so|libc\.so|ld-linux' || true)
          if [ -n "$BAD" ]; then echo "unexpected dynamic deps:"; echo "$BAD"; exit 1; fi

  # Windows / macOS：编译验证（xcap 系统 API 路径此前从未被验证过）
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
