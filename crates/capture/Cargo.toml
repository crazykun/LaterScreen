[package]
name = "lscreen-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr", "xtest", "shape"] }
# Wayland portal（M5）：纯 D-Bus 调 xdg-desktop-portal Screenshot，
# 不引 pipewire C 库；zbus 版本由 workspace/app 钉 =5.18 统一
ashpd = { version = "0.13", default-features = false, features = ["screenshot", "global_shortcuts", "async-io"] }
# ashpd 是 async API，capture 是同步库：async-io 提供 block_on 驱动
async-io = "2"
# GlobalShortcuts 的 Activated 信号是 Stream，需 StreamExt::next 消费；
# ashpd 自身即用 futures-util，版本随依赖树，不新增体积
futures-util = { version = "0.3", default-features = false }
# portal 返回截图文件（PNG/JPEG 视 DE 而定），需解码；与 app 共用同版本不增加体积
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"

# Windows：滚轮/指针合成（SendInput/SetCursorPos）+ 录制边框条窗口（user32/gdi32）。
# windows-sys 只声明系统 DLL 的外部函数，不引入链接型依赖；与 app 同版本共用
# 同一份编译产物
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS：滚轮/指针合成走 CoreGraphics C API（extern 直连，见 other.rs 的
# mac 模块）；录制边框条窗口用 NSWindow。objc2 全家已随 xcap 进入依赖树，
# 这里仅声明为直接依赖并按需开 feature，不新增编译产物
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }


