[package]
name = "lscreen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lscreen-capture = { version = "0.1.0", path = "../capture" }
lscreen-core = { version = "0.1.0", path = "../core" }
lscreen-ocr = { version = "0.1.0", path = "../ocr" }
lscreen-record = { version = "0.1.0", path = "../record" }

[target."cfg(unix)".dependencies]
libc = "0.2"
