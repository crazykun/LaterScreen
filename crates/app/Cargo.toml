[package]
name = "lscreen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
lscreen-capture = { version = "0.8.0", path = "../capture" }
lscreen-core = { version = "0.8.0", path = "../core" }
lscreen-ocr = { version = "0.8.0", path = "../ocr" }
lscreen-record = { version = "0.8.0", path = "../record" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target."cfg(unix)".dependencies]
libc = "0.2"

# 托盘（M8）：
# - Linux 用 ksni（纯 Rust 的 StatusNotifierItem/D-Bus 直连，无动态库依赖）。
#   tray-icon 的 Linux 后端要链接 gtk/libappindicator，违反「无动态库」硬约束，
#   故仅 Win/mac 使用 tray-icon（走系统原生 API）。
# - Win/mac 的托盘需要本线程有消息循环：复用 eframe 已链接的 winit（版本必须
#   与 eframe 0.35 的依赖一致，避免重复编译两份 winit）。
[target.'cfg(target_os = "linux")'.dependencies]
# blocking API 内部仍需一个 async 运行时驱动 D-Bus：async-io 比 tokio 轻
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# zbus 5.19 在 default-features=false + blocking-api 组合下自身编译失败
# （上游打包缺陷），钉回 5.18；app 用于 FileManager1 ShowItems 定位文件
# （export::open_and_select），blocking + async-io 与 capture 的 ashpd 同款
zbus = { version = "=5.18.0", default-features = false, features = ["blocking-api", "async-io"] }
# 从 eframe::CreationContext 取原始窗口句柄，设 X11 WM_CLASS（任务栏图标归属）
raw-window-handle = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.24"
winit = "0.30"

# GUI 子系统下附回父控制台（AttachConsole），保证终端里 CLI 输出可见
# Win32_System_Threading + Win32_Foundation：单例锁探测进程存活（OpenProcess）
# Win32_UI_WindowsAndMessaging：无控制台时用 MessageBoxW 报致命错误
# （GUI 子系统的 stderr 没有接收方，否则启动失败完全静默）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# build.rs：packaging/icon.png → 多尺寸 ICO 嵌入 Windows exe
[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
